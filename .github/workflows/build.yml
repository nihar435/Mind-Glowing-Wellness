name: Build Mind Glowing Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o MindGlowingWellness_Android_LiveWebsite.zip -d extracted
          ls -la extracted/MindGlowingWellness_PlayStore_Project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: extracted/MindGlowingWellness_PlayStore_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mind-Glowing-Wellness-APK
          path: extracted/MindGlowingWellness_PlayStore_Project/app/build/outputs/apk/debug/app-debug.apk
